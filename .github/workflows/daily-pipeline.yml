name: Daily Stock Pipeline

on:
  schedule:
    - cron: '0 12 * * 0-4'
  
  workflow_dispatch:

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEWS_FILE: "data/News.xlsx" 
      SENTIMENT_OUTPUT_FILE: "data/Company_FinBERT_Sentiments - ALL.xlsx"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Create Data Folder
        run: mkdir -p data

      - name: 1. Extract Latest News
        run: python "stock analysis/News_Extractor.py"

      - name: 2. Analyze Sentiment (FinBERT)
        run: python "stock analysis/Sentiment_Analyzer.py"

      - name: 3. Fetch Daily Stock Data
        run: python "stock analysis/Stock_Data_Daily.py"

      - name: 4. Run ML Predictions (Random Forest)
        run: python "stock analysis/Final_Analysis.py"

      - name: 5. Reconcile Actual vs Predicted
        run: python "stock analysis/Actual_vs_Prediction.py"

      - name: 6. Generate and Email Report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_LOGIN: ${{ secrets.BREVO_LOGIN }}
          BREVO_PASSWORD: ${{ secrets.BREVO_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
        run: |
          python "stock analysis/Reports.py"

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: daily-stock-reports
          path: data/*.xlsx
